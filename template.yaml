AWSTemplateFormatVersion: 2010-09-09
Description: >-
  Infrastructure for dbowland.com lull project

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - prod
      - test
    Description: Environment for deploy

Mappings:
  EnvironmentMap:
    prod:
      lambdaBucketName: lull-lambda
      project: lull
      roleNameCloudFormation: lull-cloudformation
      roleNamePipeline: lull-pipeline
      uiBucketName: lull-ui
    test:
      lambdaBucketName: lull-lambda-test
      project: lull-test
      roleNameCloudFormation: lull-cloudformation-test
      roleNamePipeline: lull-pipeline-test
      uiBucketName: lull-ui-test

Resources:
  # Deployment storage

  LambdaBucket:
    Type: AWS::S3::Bucket
    Properties:
      # No AccessControl: ACLs are a legacy access mechanism (cfn-lint W3045) and
      # are disabled by default on new buckets. The four PublicAccessBlock flags
      # below are what actually keeps this bucket private.
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: false
            ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      BucketName: !FindInMap [EnvironmentMap, !Ref Environment, lambdaBucketName]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: 'created-by'
          Value: 'lull-infrastructure'
        - Key: 'created-for'
          Value: 'lull'
        - Key: 'environment'
          Value: !Ref Environment

  # Deployment roles

  CloudFormationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - cloudformation.amazonaws.com
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: !Sub
            - '${Project}-cloudformation'
            - Project: !FindInMap [EnvironmentMap, !Ref Environment, project]
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Everything except IAM, which is granted back narrowly below.
              #
              # The pipeline role's cloudformation:* is scoped to stack/lull-*, and it is tempting to
              # read that as the containment. It is not: it constrains WHICH STACKS may be touched,
              # never WHAT THOSE STACKS MAY CREATE. Without the exclusions here, a pipeline
              # credential creates a stack named lull-anything, passes this role, and has the stack
              # provision privilege for itself -- reaching every unrelated product in this account.
              #
              # `iam:*User` alone was not enough, twice over. It matches only actions whose name
              # ENDS in User, so iam:PutUserPolicy, iam:AttachUserPolicy, iam:CreateAccessKey,
              # iam:CreateLoginProfile and iam:UpdateAssumeRolePolicy all sailed through -- an
              # AWS::IAM::Policy resource naming the pipeline user made that user an account admin.
              # And scoping CreateRole/AttachRolePolicy to role/lull-* constrained the role's NAME
              # while leaving its trust policy and attached policies unconstrained, so
              # `RoleName: lull-pwn` with AdministratorAccess was still reachable.
              - Effect: Allow
                NotAction:
                  - 'account:*'
                  - 'iam:*'
                  - 'organizations:*'
                Resource: '*'
              # The role actions a SAM deploy genuinely needs. CloudFormation derives execution-role
              # names from the stack name, so every role these stacks create is lull-*.
              - Effect: Allow
                Action:
                  - 'iam:CreateRole'
                  - 'iam:TagRole'
                  - 'iam:UntagRole'
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/lull-*'
              # Only the managed policy the Lambdas actually use. Without this condition,
              # AttachRolePolicy on a lull-* role could attach AdministratorAccess.
              - Effect: Allow
                Action: 'iam:AttachRolePolicy'
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/lull-*'
                Condition:
                  ArnEquals:
                    'iam:PolicyARN': 'arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
              # Inline policies on lull-* roles: SAM writes the per-function DynamoDB and log
              # grants this way.
              - Effect: Allow
                Action:
                  - 'iam:DeleteRole'
                  - 'iam:DeleteRolePolicy'
                  - 'iam:DetachRolePolicy'
                  - 'iam:GetRole'
                  - 'iam:GetRolePolicy'
                  - 'iam:ListRolePolicies'
                  - 'iam:ListAttachedRolePolicies'
                  - 'iam:PutRolePolicy'
                  - 'iam:UpdateAssumeRolePolicy'
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/lull-*'
              - Effect: Allow
                Action: 'iam:PassRole'
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/lull-*'
      RoleName: !FindInMap [EnvironmentMap, !Ref Environment, roleNameCloudFormation]
      Tags:
        - Key: 'created-by'
          Value: 'lull-infrastructure'
        - Key: 'created-for'
          Value: 'lull'
        - Key: 'environment'
          Value: !Ref Environment

  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub '${AWS::AccountId}'
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: !Sub
            - '${Project}-pipeline'
            - Project: !FindInMap [EnvironmentMap, !Ref Environment, project]
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 'iam:PassRole'
                Resource: !Sub '${CloudFormationRole.Arn}'
              # Scoped to Lull's own stacks. connections-infrastructure grants
              # cloudformation:* on Resource '*', which lets any pipeline role
              # delete any stack in the account, including every unrelated
              # project. The Serverless transform ARN is required for SAM
              # templates -- without it CreateChangeSet fails.
              #
              # If a deploy ever hits an AccessDenied on a cloudformation:*
              # action, this is the first statement to look at.
              - Effect: Allow
                Action: 'cloudformation:*'
                Resource:
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/lull-*'
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/lull-*/*'
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/*/*'
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31'
              # Account-level calls that accept no resource. All read-only --
              # IAM requires '*' for these and they cannot mutate a stack.
              - Effect: Allow
                Action:
                  - 'cloudformation:DescribeAccountLimits'
                  - 'cloudformation:GetTemplateSummary'
                  - 'cloudformation:ListExports'
                  - 'cloudformation:ListImports'
                  - 'cloudformation:ListStacks'
                  - 'cloudformation:ValidateTemplate'
                Resource: '*'
              # Cross-repo coupling: uiBucketName must match the bucket lull-ui's
              # own template creates. IAM accepts a nonexistent ARN silently, so a
              # mismatch surfaces only as AccessDenied at UI deploy time.
              #
              # BOTH environments' buckets in BOTH roles, matching every sibling
              # infra repo. The literal prod/test keys below are deliberate -- these
              # do not follow !Ref Environment.
              - Effect: Allow
                Action:
                  - 's3:DeleteObject'
                  - 's3:GetObject*'
                  - 's3:PutObject*'
                  - 's3:GetBucket*'
                  - 's3:List*'
                Resource:
                  - !Sub
                    - 'arn:aws:s3:::${UiBucket}'
                    - UiBucket: !FindInMap [EnvironmentMap, prod, uiBucketName]
                  - !Sub
                    - 'arn:aws:s3:::${UiBucket}/*'
                    - UiBucket: !FindInMap [EnvironmentMap, prod, uiBucketName]
                  - !Sub
                    - 'arn:aws:s3:::${UiBucket}'
                    - UiBucket: !FindInMap [EnvironmentMap, test, uiBucketName]
                  - !Sub
                    - 'arn:aws:s3:::${UiBucket}/*'
                    - UiBucket: !FindInMap [EnvironmentMap, test, uiBucketName]
                  - !Sub 'arn:aws:s3:::${LambdaBucket}/*'
                  - !Sub 'arn:aws:s3:::${LambdaBucket}'
              # For scripts/deploy-prompts.ts in lull-api, which runs as this role AFTER the stack
              # deploy and pushes prompts/ into the prompts table. Prompt text is data, not code, so
              # tuning a prompt is not a code change -- which only works if the pipeline can write.
              #
              # Exactly the two actions that script calls: Query in getExistingPrompt, PutItem in
              # deployPrompt. connections-infrastructure grants six here -- adding DeleteItem, Scan,
              # GetItem and DescribeTable -- and this deliberately does not follow it, for the same
              # reason the cloudformation block above is scoped to lull-* stacks.
              #
              # DeleteItem is the one worth naming: prompts are keyed PromptId + UpdatedAt so every
              # revision is retained, and that history is the only record of what a model was
              # actually asked on a given night. A pipeline that can delete rows can erase it.
              #
              # Query is NOT optional despite the script surviving without it. getExistingPrompt
              # swallows its own failure and returns null, so an unauthorized Query silently turns
              # the skip-unchanged check into "always write" -- a new revision every pipeline run,
              # forever, whether or not the prompt changed.
              #
              # BOTH environments' tables in BOTH roles, matching the S3 block above and every
              # sibling infra repo. The literal prod/test names are deliberate and do not follow
              # !Ref Environment. IAM accepts a nonexistent ARN silently, so a name that drifts from
              # lull-api's template.yaml surfaces only as AccessDenied at prompt-deploy time.
              - Effect: Allow
                Action:
                  - 'dynamodb:PutItem'
                  - 'dynamodb:Query'
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/lull-api-prompts'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/lull-api-prompts-test'
      RoleName: !FindInMap [EnvironmentMap, !Ref Environment, roleNamePipeline]
      Tags:
        - Key: 'created-by'
          Value: 'lull-infrastructure'
        - Key: 'created-for'
          Value: 'lull'
        - Key: 'environment'
          Value: !Ref Environment

  # Deployment users

  LullApiUser:
    Type: AWS::IAM::User
    Properties:
      Policies:
        - PolicyName: !Sub
            - '${Project}-pipeline'
            - Project: !FindInMap [EnvironmentMap, !Ref Environment, project]
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # BOTH roles, for BOTH environments' users, deliberately.
              #
              # A single AWS_ACCESS_KEY_ID secret drives the whole pipeline, and
              # one workflow run assumes the testing role and then the production
              # role (see connections-api/.github/workflows/pipeline.yaml -- five
              # assume-role steps, one credential). In practice the staging user
              # is the one used in every environment.
              #
              # So there is no credential-level separation between test and prod
              # here, by choice. Restricting the test user to the test role looks
              # obviously correct and breaks production deploys outright.
              - Effect: Allow
                Action: 'sts:AssumeRole'
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/lull-pipeline'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/lull-pipeline-test'
      Tags:
        - Key: 'created-by'
          Value: 'lull-infrastructure'
        - Key: 'created-for'
          Value: 'lull'
        - Key: 'environment'
          Value: !Ref Environment

  UiUser:
    Type: AWS::IAM::User
    Properties:
      Policies:
        - PolicyName: !Sub
            - '${Project}-pipeline'
            - Project: !FindInMap [EnvironmentMap, !Ref Environment, project]
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # BOTH roles, for BOTH environments' users, deliberately.
              #
              # A single AWS_ACCESS_KEY_ID secret drives the whole pipeline, and
              # one workflow run assumes the testing role and then the production
              # role (see connections-api/.github/workflows/pipeline.yaml -- five
              # assume-role steps, one credential). In practice the staging user
              # is the one used in every environment.
              #
              # So there is no credential-level separation between test and prod
              # here, by choice. Restricting the test user to the test role looks
              # obviously correct and breaks production deploys outright.
              - Effect: Allow
                Action: 'sts:AssumeRole'
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/lull-pipeline'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/lull-pipeline-test'
      Tags:
        - Key: 'created-by'
          Value: 'lull-infrastructure'
        - Key: 'created-for'
          Value: 'lull'
        - Key: 'environment'
          Value: !Ref Environment

Outputs:
  LambdaBucketName:
    Description: Name of the S3 bucket holding Lambda deployment packages
    Value: !Ref LambdaBucket
  CloudFormationRoleArn:
    Description: ARN of the role CloudFormation assumes to create stack resources
    Value: !GetAtt CloudFormationRole.Arn
  PipelineRoleArn:
    Description: ARN of the role the lull-api and lull-ui pipelines assume to deploy
    Value: !GetAtt PipelineRole.Arn
  # CloudFormation generates these names. This is how you find out what they are
  # when you go to mint an access key.
  ApiUserName:
    Description: IAM user the lull-api pipeline authenticates as
    Value: !Ref LullApiUser
  UiUserName:
    Description: IAM user the lull-ui pipeline authenticates as
    Value: !Ref UiUser
