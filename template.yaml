AWSTemplateFormatVersion: 2010-09-09
Description: >-
  Infrastructure for dbowland.com lull project

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - prod
      - test
    Description: Environment for deploy

Mappings:
  EnvironmentMap:
    prod:
      lambdaBucketName: lull-lambda
      project: lull
      roleNameCloudFormation: lull-cloudformation
      roleNamePipeline: lull-pipeline
      userNameApi: lull-api-user
      userNameUi: lull-ui-user
    test:
      lambdaBucketName: lull-lambda-test
      project: lull-test
      roleNameCloudFormation: lull-cloudformation-test
      roleNamePipeline: lull-pipeline-test
      userNameApi: lull-api-user-test
      userNameUi: lull-ui-user-test

Resources:
  # Deployment storage

  LambdaBucket:
    Type: AWS::S3::Bucket
    Properties:
      # No AccessControl: ACLs are a legacy access mechanism (cfn-lint W3045) and
      # are disabled by default on new buckets. The four PublicAccessBlock flags
      # below are what actually keeps this bucket private.
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: false
            ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      BucketName: !FindInMap [EnvironmentMap, !Ref Environment, lambdaBucketName]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: 'created-by'
          Value: 'lull-infrastructure'
        - Key: 'created-for'
          Value: 'lull'
        - Key: 'environment'
          Value: !Ref Environment

  # Deployment roles

  CloudFormationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - cloudformation.amazonaws.com
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: !Sub
            - '${Project}-cloudformation'
            - Project: !FindInMap [EnvironmentMap, !Ref Environment, project]
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                NotAction:
                  - 'iam:*User'
                  - 'organizations:*'
                  - 'account:*'
                Resource: '*'
      RoleName: !FindInMap [EnvironmentMap, !Ref Environment, roleNameCloudFormation]
      Tags:
        - Key: 'created-by'
          Value: 'lull-infrastructure'
        - Key: 'created-for'
          Value: 'lull'
        - Key: 'environment'
          Value: !Ref Environment

  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub '${AWS::AccountId}'
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: !Sub
            - '${Project}-pipeline'
            - Project: !FindInMap [EnvironmentMap, !Ref Environment, project]
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 'iam:PassRole'
                Resource: !Sub '${CloudFormationRole.Arn}'
              - Effect: Allow
                Action: 'cloudformation:*'
                Resource: '*'
              # Cross-repo coupling: these bucket names must match the buckets
              # lull-ui's own template creates. IAM accepts a nonexistent ARN
              # silently, so a mismatch surfaces only as AccessDenied at UI
              # deploy time.
              - Effect: Allow
                Action:
                  - 's3:DeleteObject'
                  - 's3:GetObject*'
                  - 's3:PutObject*'
                  - 's3:GetBucket*'
                  - 's3:List*'
                Resource:
                  - 'arn:aws:s3:::lull-ui/*'
                  - 'arn:aws:s3:::lull-ui'
                  - 'arn:aws:s3:::lull-ui-test/*'
                  - 'arn:aws:s3:::lull-ui-test'
                  - !Sub 'arn:aws:s3:::${LambdaBucket}/*'
                  - !Sub 'arn:aws:s3:::${LambdaBucket}'
      RoleName: !FindInMap [EnvironmentMap, !Ref Environment, roleNamePipeline]
      Tags:
        - Key: 'created-by'
          Value: 'lull-infrastructure'
        - Key: 'created-for'
          Value: 'lull'
        - Key: 'environment'
          Value: !Ref Environment

  # Deployment users

  LullApiUser:
    Type: AWS::IAM::User
    Properties:
      Policies:
        - PolicyName: !Sub
            - '${Project}-pipeline'
            - Project: !FindInMap [EnvironmentMap, !Ref Environment, project]
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 'sts:AssumeRole'
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/lull-pipeline'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/lull-pipeline-test'
      Tags:
        - Key: 'created-by'
          Value: 'lull-infrastructure'
        - Key: 'created-for'
          Value: 'lull'
        - Key: 'environment'
          Value: !Ref Environment
      UserName: !FindInMap [EnvironmentMap, !Ref Environment, userNameApi]

  UiUser:
    Type: AWS::IAM::User
    Properties:
      Policies:
        - PolicyName: !Sub
            - '${Project}-pipeline'
            - Project: !FindInMap [EnvironmentMap, !Ref Environment, project]
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 'sts:AssumeRole'
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/lull-pipeline'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/lull-pipeline-test'
      Tags:
        - Key: 'created-by'
          Value: 'lull-infrastructure'
        - Key: 'created-for'
          Value: 'lull'
        - Key: 'environment'
          Value: !Ref Environment
      UserName: !FindInMap [EnvironmentMap, !Ref Environment, userNameUi]

Outputs:
  LambdaBucketName:
    Description: Name of the S3 bucket holding Lambda deployment packages
    Value: !Ref LambdaBucket
  CloudFormationRoleArn:
    Description: ARN of the role CloudFormation assumes to create stack resources
    Value: !GetAtt CloudFormationRole.Arn
  PipelineRoleArn:
    Description: ARN of the role the lull-api and lull-ui pipelines assume to deploy
    Value: !GetAtt PipelineRole.Arn
  ApiUserName:
    Description: IAM user the lull-api pipeline authenticates as
    Value: !Ref LullApiUser
  UiUserName:
    Description: IAM user the lull-ui pipeline authenticates as
    Value: !Ref UiUser
